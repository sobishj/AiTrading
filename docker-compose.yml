# Fixed project name so container/volume names never depend on the folder name.
name: aitrading

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aitrading-pg
    restart: unless-stopped

    environment:
      POSTGRES_DB: aitrading
      POSTGRES_USER: aitrading
      POSTGRES_PASSWORD: aitrading

    ports:
      - "5433:5432"

    volumes:
      - aitrading_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aitrading-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

    volumes:
      - aitrading_pgadmin_data:/var/lib/pgadmin

volumes:
  aitrading_pgdata:
  aitrading_pgadmin_data: